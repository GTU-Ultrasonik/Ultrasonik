; M3 Control Firmware - Ultrasonik
;
;   native         : hardware-free core logic + Unity unit tests (Windows/Linux, needs gcc)
;   esp32          : real control-board firmware (this exact build is used on the rig AND in HIL)
;   esp32_simball  : same firmware with the built-in simulated ball (no serial heights / fan_state)
;
; The repository's .gitignore ignores every lib/ folder, so the PlatformIO folders are renamed:
;   src/firmware  ESP32 glue (main.cpp, m3_config.h)
;   src/core      hardware-free libraries: contract/, m3_core/
;   tests/native  Unity tests (one folder per suite)

[platformio]
default_envs = native
src_dir = src/firmware
lib_dir = src/core
include_dir = src/firmware
test_dir = tests/native

[env]
build_flags = -Wall -Wextra

[env:native]
platform = native@1.2.1
test_framework = unity   ; only here: firmware builds need no test library
build_flags = ${env.build_flags} -std=gnu11 -lm
test_build_src = no

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32_simball]
extends = env:esp32
build_flags = ${env.build_flags} -D M3_SIM_BALL=1
